kind: pipeline
type: docker
name: default

steps:

- name: build
  image: harness0.harness.io/oci/docker_artifacts/hhi/go:1.26.10
  commands:
    - go test ./...
    - sh scripts/build.sh

- name: publish
  image: plugins/docker
  settings:
    repo: plugins/drone-snyk
    auto_tag: true
    dockerfile: docker/Dockerfile
    username:
      from_secret: docker_username
    password:
      from_secret: docker_password
